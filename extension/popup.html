<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<head>
<style>
  * { box-sizing: border-box; }
  body {
    width: 380px;
    margin: 0;
    padding: 14px;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0f14;
    color: #e7edf4;
  }
  h4 {
    margin: 0 0 4px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hint {
    font-size: 10px;
    color: #7f8c9d;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  textarea {
    width: 100%;
    height: 110px;
    background: #10161e;
    color: #cfd8e3;
    border: 1px solid #263647;
    border-radius: 6px;
    padding: 8px;
    font-size: 11px;
    resize: vertical;
  }
  button {
    width: 100%;
    padding: 9px;
    margin-top: 8px;
    background: linear-gradient(90deg, #008dbd, #00c6ff);
    color: white;
    border: none;
    border-radius: 6px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #status {
    font-size: 11px;
    color: #7f8c9d;
    margin-top: 8px;
    text-align: center;
  }

  #resultBox { display: none; margin-top: 12px; }

  .risk-banner {
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 10px;
  }
  .risk-banner.high { background: rgba(255, 79, 88, 0.15); border: 1px solid rgba(255, 79, 88, 0.4); }
  .risk-banner.medium { background: rgba(255, 180, 60, 0.15); border: 1px solid rgba(255, 180, 60, 0.4); }
  .risk-banner.low { background: rgba(80, 200, 120, 0.12); border: 1px solid rgba(80, 200, 120, 0.35); }
  .risk-banner.safe { background: rgba(0, 198, 255, 0.1); border: 1px solid rgba(0, 198, 255, 0.3); }

  .risk-banner .score {
    font-size: 26px;
    font-weight: 800;
  }
  .risk-banner .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }
  .high .score, .high .label { color: #ff5d65; }
  .medium .score, .medium .label { color: #ffb43c; }
  .low .score, .low .label { color: #4fd67c; }
  .safe .score, .safe .label { color: #00c6ff; }

  .section {
    margin-top: 10px;
    padding: 10px;
    background: #10161e;
    border: 1px solid #1e2a38;
    border-radius: 8px;
  }
  .section-title {
    font-size: 9px;
    letter-spacing: 1px;
    color: #627183;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 3px 0;
    border-bottom: 1px solid #1a2430;
  }
  .row:last-child { border-bottom: none; }
  .row .k { color: #7f8c9d; }
  .row .v { color: #dbe4ee; font-weight: 600; text-align: right; }

  .pass { color: #4fd67c !important; }
  .fail { color: #ff5d65 !important; }

  .reasons { font-size: 11px; }
  .reasons ul { margin: 4px 0 0; padding-left: 16px; }
  .reasons li { margin-bottom: 4px; color: #c3ccd6; }
  .reasons .none { color: #627183; font-style: italic; }

  #newAnalysisBtn {
    background: #111a25;
    border: 1px solid #293747;
    color: #b8c4d1;
    margin-top: 10px;
  }
</style>
</head>
<body>

  <h4>🛡️ Email Threat Detector</h4>
  <div class="hint">
    Paste the raw email source (View Original / View Message Source / View Raw Message) below:
  </div>

  <div id="inputArea">
    <textarea id="rawEmail" placeholder="Paste raw email here..."></textarea>
    <button id="analyzeBtn">Analyze Email</button>
    <div id="status"></div>
  </div>

  <div id="resultBox"></div>

  <script src="popup.js"></script>
</body>
</html>
